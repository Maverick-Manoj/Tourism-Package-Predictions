name: Tourism MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/pipeline.yml'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Register and validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install validation dependencies
        run: pip install 'pandas>=2.1,<3' 'pytest>=8,<10' 'scikit-learn>=1.6,<1.9'
      - name: Validate raw data schema
        run: python -m src.validate_data
      - name: Run automated tests
        run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/data_validation.json

  prepare:
    name: Clean and prepare train/test splits
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install preprocessing dependencies
        run: pip install 'pandas>=2.1,<3' 'scikit-learn>=1.6,<1.9'
      - name: Prepare stratified splits
        run: python -m src.prepare_data
      - uses: actions/upload-artifact@v4
        with:
          name: training-data
          path: |
            build/train.csv
            build/test.csv
            build/split_manifest.json
          retention-days: 14

  train:
    name: Tune, track, train and evaluate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install experiment dependencies
        run: pip install -r requirements-ml.txt
      - uses: actions/download-artifact@v4
        with:
          name: training-data
          path: build
      - name: Train with MLflow experiments
        env:
          MLFLOW_ALLOW_FILE_STORE: 'true'
        run: python -m src.train_model
      - name: Independently verify saved model
        run: python -m src.evaluate_model
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model-and-reports
          path: |
            models/best_model.joblib
            models/model_metadata.json
            reports/metrics.json
            reports/experiments.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiments
          path: mlruns/
          retention-days: 30

  publish:
    name: Commit evaluated model to main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: train
    runs-on: ubuntu-latest
    concurrency:
      group: tourism-model-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: trained-model-and-reports
          path: .
      - name: Commit model and metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/best_model.joblib models/model_metadata.json reports/metrics.json reports/experiments.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(model): publish evaluated tourism model [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No changes to publish.'
          fi